# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDITED & FIXED VERSION
# #######################################################################################

################
### MONITORS ###
################

monitor=DP-1,preferred,0x0,1
monitor=HDMI-A-1,1920x1080@100,1920x0,1

###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = dolphin

# CORREGIDO: Las opciones de rofi deben ir en inglés (-theme, -font, -icon-theme, window)
$menu = rofi -combi-modi window,drun,ssh -theme solarized -font "hack 10" -show combi -icon-theme "Papirus" -show-icons

#################
### AUTOSTART ###
#################

exec-once = $terminal
exec-once = waybar
exec-once = spotify
exec-once = hypridle
exec-once = sleep 2 && hyprpaper

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = WLR_DRM_DEVICES,/dev/dri/card1

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2

    col.active_border = rgba(f725857e) rgba(f725857e) 45deg
    col.inactive_border = rgba(3a0ca3fe)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    
    # Esta opción requiere Hyprland v0.45+. Si te da error, bórrala.
    rounding_power = 2

    active_opacity = 0.8
    inactive_opacity = 0.65

    # NUEVA SINTAXIS DE SOMBRAS (Correcta para v0.45+)
    # Si te da error "unknown category", estás en una versión vieja.
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(f725857f)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    # Cyberpunk-inspired bezier curves
    bezier = cyberSlice, 0.1, 0.9, 0.1, 1.05
    bezier = neonPulse, 0.7, 0, 0.3, 1
    bezier = glitchOut, 0.1, 1.2, 0.1, 0.9
    bezier = quickShock, 0.2, -0.2, 0.1, 1.4
    bezier = synthWave, 0.3, -0.3, 0.7, 1.2
    
    animation = global, 1, 7, synthWave
    animation = windows, 1, 3.5, cyberSlice
    animation = windowsIn, 1, 3.1, glitchOut, popin 92%
    animation = windowsOut, 1, 2.1, quickShock, popin 82%
    animation = border, 1, 6.2, neonPulse
    animation = fadeIn, 1, 1.3, quickShock
    animation = fadeOut, 1, 1.2, cyberSlice
    animation = fade, 1, 2.5, synthWave
    animation = layers, 1, 2.8, glitchOut
    animation = layersIn, 1, 3.2, neonPulse, fade
    animation = layersOut, 1, 1.4, quickShock, fade
    animation = fadeLayersIn, 1, 1.4, quickShock
    animation = fadeLayersOut, 1, 1.2, glitchOut
    animation = workspaces, 1, 1.5, synthWave, slide
    animation = workspacesIn, 1, 1.1, cyberSlice, slidevert
    animation = workspacesOut, 1, 1.3, quickShock, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, 
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen,

bind = $mainMod, A, movefocus, l
bind = $mainMod, D, movefocus, r
bind = $mainMod, W, movefocus, u
bind = $mainMod, S, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, N, togglespecialworkspace, magic
bind = $mainMod SHIFT, N, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# SCREENSHOTS CORREGIDOS
# Se añadió el comando $(date ...) y comillas para manejar rutas y espacios correctamente
bind = , Print, exec, grim "/home/juloaizar/images/screenshots/$(date +'%Y-%m-%d_%H:%M:%S.png')"
bind = SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

# Multimedia
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = match:class .*, suppress_event maximize

$inFocusOpacity = 0.65
$ooFocusOpacity = $inFocusOpacity
windowrule {
  name = ignore-empty-xwayland-popups
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
  no_initial_focus = on
}
